version: 2

models:
  - name: stg_departements
    description: "Départements de l'université, nettoyés depuis la source brute."
    columns:
      - name: id_departement
        tests: [unique, not_null]

  - name: stg_formations
    description: "Formations proposées, rattachées à un département."
    columns:
      - name: id_formation
        tests: [unique, not_null]
      - name: id_departement
        tests:
          - relationships:
              arguments:
                to: ref('stg_departements')
                field: id_departement

  - name: stg_enseignants
    description: "Corps professoral, rattaché à un département."
    columns:
      - name: id_enseignant
        tests: [unique, not_null]

  - name: stg_etudiants
    description: "Profils étudiants nettoyés (identité, statut, démographie)."
    columns:
      - name: id_etudiant
        tests: [unique, not_null]
      - name: matricule
        tests: [unique, not_null]
      - name: statut
        tests:
          - accepted_values:
              arguments:
                values: ["Actif", "Diplômé", "Abandon"]

  - name: stg_annees_academiques
    description: "Référentiel temporel (année académique + semestre)."
    columns:
      - name: id_annee
        tests: [unique, not_null]

  - name: stg_cours
    description: "Cours dispensés, rattachés à une formation, un enseignant et une période."
    columns:
      - name: id_cours
        tests: [unique, not_null]

  - name: stg_inscriptions
    description: "Inscriptions des étudiants à une formation pour une période donnée."
    columns:
      - name: id_inscription
        tests: [unique, not_null]

  - name: stg_notes
    description: "Notes obtenues par les étudiants pour chaque cours et évaluation."
    columns:
      - name: id_note
        tests: [unique, not_null]
      - name: note
        tests: [not_null]

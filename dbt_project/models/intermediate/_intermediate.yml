version: 2

models:
  - name: int_etudiants_enrichis
    description: "Étudiants enrichis avec âge, tranche d'âge, nom complet ; dédoublonnés."
    columns:
      - name: id_etudiant
        tests: [unique, not_null]
      - name: tranche_age
        tests:
          - accepted_values:
              arguments:
                values: ["18-19", "20-22", "23-25", "26+"]

  - name: int_formations_enrichies
    description: "Formations jointes à leur département (nom, faculté)."
    columns:
      - name: id_formation
        tests: [unique, not_null]

  - name: int_enseignants_enrichis
    description: "Enseignants joints à leur département."
    columns:
      - name: id_enseignant
        tests: [unique, not_null]

  - name: int_cours_enrichis
    description: "Cours joints à leur formation, enseignant et période académique."
    columns:
      - name: id_cours
        tests: [unique, not_null]

  - name: int_inscriptions_enrichies
    description: "Inscriptions jointes aux étudiants et formations, avec contexte démographique."
    columns:
      - name: id_inscription
        tests: [unique, not_null]

  - name: int_notes_enrichies
    description: "Notes enrichies avec mention calculée, statut de validation, et contexte complet."
    columns:
      - name: id_note
        tests: [unique, not_null]
      - name: mention
        tests:
          - accepted_values:
              arguments:
                values: ["Insuffisant", "Passable", "Assez Bien", "Bien", "Très Bien"]

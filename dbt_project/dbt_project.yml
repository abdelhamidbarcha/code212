# =====================================================================
#  Projet dbt — Pilotage des inscriptions (données Apogée)
# =====================================================================
name: 'dcode212_academique'
version: '2.0.0'
config-version: 2
profile: 'dcode212_academique'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

# ---------------------------------------------------------------------
#  Modèles : un schéma PostgreSQL par couche
# ---------------------------------------------------------------------
models:
  dcode212_academique:
    staging:            # nettoyage / typage / dédoublonnage des sources
      +schema: staging
      +materialized: table   # tables (et non vues) : le dédoublonnage n'est calculé qu'une fois
    intermediate:       # logique métier réutilisable
      +schema: intermediate
      +materialized: view
    marts:              # modèle en étoile (dimensions + faits)
      +schema: marts
      +materialized: table
    reporting:          # tables "prêtes à l'emploi" pour Superset (seul schéma exposé à la BI)
      +schema: reporting
      +materialized: table
# ---------------------------------------------------------------------
#  Seeds : nomenclatures (libellés) — à remplacer par celles de l'université
#  Les codes sont forcés en texte pour conserver les zéros initiaux (ex : "001").
# ---------------------------------------------------------------------
seeds:
  dcode212_academique:
    +schema: referentiel
    +quote_columns: false
    ref_composante:
      +column_types: {cod_cmp: text, lib_cmp: text, type_etablissement: text, mode_acces: text}
    ref_etape:
      +column_types: {cod_etp: text, cod_vrs_vet: text, lib_etp: text, cod_cmp: text, cod_filiere: text,
                      lib_filiere: text, cycle: text, annee_etude: integer, duree_cycle: integer,
                      est_annee_terminale: text}
    ref_element_pedagogique:
      +column_types: {cod_elp: text, lib_elp: text, cod_etp: text, semestre: text, nature_elp: text}
    ref_pays:
      +column_types: {cod_pay: text, lib_pays: text, lib_nationalite: text, zone_geographique: text}
    ref_departement_naissance:
      +column_types: {cod_dep: text, lib_province: text, lib_region: text}
    ref_etat_iae:
      +column_types: {eta_iae: text, lib_etat_iae: text, compte_dans_effectif: text}
    ref_controle_qualite:
      +column_types: {code_controle: text, libelle_controle: text, categorie: text, gravite: text, table_source: text}


# ---------------------------------------------------------------------
#  Variables métier (adaptables aux conventions de l'université)
# ---------------------------------------------------------------------
vars:
  # Codes utilisateur Apogée correspondant à des traitements automatiques (saisie en masse)
  utilisateurs_batch: ['APOBATCH']
  # Mois de référence pour le calcul de l'âge à l'inscription (octobre de l'année universitaire)
  mois_reference_age: 10